name: Reusable — API client (PHP) build

on:
  workflow_call:
    inputs:
      project-dir:
        type: string
        default: .

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: composer test

      - name: Verify no localized runtime strings in src
        run: |
          if rg -n '"[^"]*(?:Bitte|Fehler| erfolgreich| nicht verfügbar)"' src/ 2>/dev/null; then
            echo "Localized UI strings found in public API client src/" >&2
            exit 1
          fi
          echo "OK — no obvious localized strings in src/"
